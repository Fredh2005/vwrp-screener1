name: Refresh screener and publish

# GitHub's scheduler is best-effort. It routinely starts crons an hour or more
# late on this account, and on 26-27 Aug 2026 it dropped roughly 44 hours of
# firings across every repo here - no runs, no failures, just silence, and the
# daily update sat unchanged for two days.
#
# So this workflow no longer depends on any single firing. Several crons fire
# through the night and each run asks one question: has the live site already
# published for this cycle? If it has, the run stops at the guard. If it has
# not, it builds. A dropped cron therefore costs a later update, not a lost one.
#
# The guard reads the wall clock, which the previous design deliberately did
# not. The distinction matters: the old guard asked "which cron slot am I in?",
# which a delayed run answers WRONGLY and then skips the real firing while
# reporting success. This one asks "has tonight's cycle published yet?" - a
# question a delayed run still answers correctly. That also removes the
# BST/GMT cron pairing entirely.
on:
  schedule:
    - cron: "35 20 * * *"   # 21:35 UK in BST - the on-time slot
    - cron: "45 21 * * *"   # 21:45 UK in GMT - the on-time slot
    - cron: "55 22 * * *"   # catch-up
    - cron: "5 0 * * *"     # catch-up
    - cron: "15 2 * * *"    # catch-up
    - cron: "25 4 * * *"    # catch-up
  workflow_dispatch:        # manual "Run workflow" button, always proceeds

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          SITE: https://fredh2005.github.io/vwrp-screener1/
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date +%s)
          UK_H=$(TZ=Europe/London date +%-H)

          # The cycle starts at 21:35 UK and can legitimately finish after
          # midnight, so before 08:00 UK we are still working on last night's.
          if [ "$UK_H" -lt 8 ]; then
            CYCLE=$(TZ=Europe/London date -d 'yesterday' +%F)
          else
            CYCLE=$(TZ=Europe/London date +%F)
          fi
          echo "UK now: $(TZ=Europe/London date '+%F %H:%M %Z')  cycle=$CYCLE"

          # Never publish early: in GMT the first slot lands at 20:35 UK.
          TARGET=$(TZ=Europe/London date -d "$CYCLE 21:35" +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            echo "Before 21:35 UK - too early. A later slot will pick this up."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything published after 21:00 UK on the cycle date is this cycle's.
          WINDOW=$(TZ=Europe/London date -d "$CYCLE 21:00" +%s)

          LM=$(curl -sSI --max-time 30 "$SITE" | tr -d '\r' \
               | awk -F': ' 'tolower($1)=="last-modified"{print $2}') || LM=""
          if [ -z "$LM" ]; then
            echo "No Last-Modified from $SITE - building rather than risk a missed night."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUB=$(date -d "$LM" +%s) || PUB=0
          echo "Live site last published: $LM"
          if [ "$PUB" -ge "$WINDOW" ]; then
            echo "Already published for the $CYCLE cycle - nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing published since $CYCLE 21:00 UK - building."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas openpyxl

      - name: Run the screener
        run: python -W ignore screener.py --top 150 --refresh

      - name: Fail if the dataset came back thin
        run: |
          N=$(python -c "import json;print(json.load(open('output/data.json'))['count'])")
          echo "holdings in data.json: $N"
          if [ "$N" -lt 300 ]; then
            echo "::error::Only $N holdings in the dataset - not publishing."
            exit 1
          fi

      - name: Fail if the screen came back thin
        run: |
          # A silent half-empty page is worse than a visible red X.
          ROWS=$(python -c "import json,re;s=open('output/dashboard.html').read();\
          print(len(json.loads(re.search(r'const DATA = (\{.*?\});?\n',s,re.S).group(1))['rows']))")
          echo "rows generated: $ROWS"
          if [ "$ROWS" -lt 100 ]; then
            echo "::error::Only $ROWS rows generated (expected ~150) - not publishing."
            exit 1
          fi

      - name: Assemble the site
        run: |
          mkdir -p site
          cp output/dashboard.html site/index.html
          cp output/vwrp_screen_*.xlsx site/ 2>/dev/null || true
          # Machine-readable feed the geography site aggregates by country.
          cp output/data.json site/data.json
          # home-screen icons and manifest live in the repo, not in output/
          cp manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png site/
          ls -la site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
