name: Keep scheduled builds alive

# GitHub disables scheduled workflows in a public repo after 60 days without a
# commit. Since fund holdings only need refreshing every few months, the repo
# would go quiet, the nightly build would silently stop, and the published page
# would freeze without any obvious sign. This makes one trivial commit a month
# purely to reset that 60-day clock.
on:
  schedule:
    - cron: "17 4 1 * *"    # 04:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the heartbeat
        run: |
          mkdir -p .github
          echo "Last automated activity: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            > .github/last-active.txt
          echo "" >> .github/last-active.txt
          echo "This file exists only to keep the repository active so GitHub" \
            >> .github/last-active.txt
          echo "does not disable the nightly screener build. Nothing reads it." \
            >> .github/last-active.txt

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-active.txt
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: monthly heartbeat to keep schedules enabled"
            git push
          fi
